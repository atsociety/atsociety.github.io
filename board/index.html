<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Members Area — ATS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body { background: var(--surface); }
    .lock-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .lock-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 18px;
      box-shadow: var(--shadow-lg); padding: 40px 36px; max-width: 420px; width: 100%; text-align: center;
    }
    .lock-card img { width: 64px; height: 64px; margin: 0 auto 16px; }
    .lock-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .lock-card p { color: var(--muted); font-size: 0.95rem; }
    .lock-card input {
      width: 100%; padding: 13px 14px; border: 1.5px solid #8FA6C9; border-radius: 10px;
      font-size: 1rem; font-family: inherit; margin: 6px 0 12px;
    }
    .lock-card input:focus { border-color: var(--gsu-blue); }
    .lock-card label { display: block; text-align: left; font-weight: 650; font-size: 0.88rem; margin-top: 14px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .lock-card .btn { width: 100%; }
    .lock-error { color: #B3261E; font-size: 0.88rem; font-weight: 600; margin-top: 10px; min-height: 1.2em; }
    .lock-back { margin-top: 18px; font-size: 0.88rem; }

    .hub { display: none; }
    .hub-bar {
      position: sticky; top: 0; z-index: 40; background: var(--gsu-blue-deep); color: var(--white);
      padding: 13px 0;
    }
    .hub-bar .container { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .hub-bar .hb-title { font-weight: 800; display: flex; align-items: center; gap: 9px; }
    .hub-bar a, .hub-bar button {
      color: var(--light-blue); background: none; border: none; font: inherit; font-size: 0.88rem;
      font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .hub-bar a:hover, .hub-bar button:hover { color: var(--white); }
    .hub-layout { display: grid; grid-template-columns: 250px 1fr; gap: 40px; padding: 44px 0 80px; }
    .hub-toc { position: sticky; top: 80px; align-self: start; }
    .hub-toc h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .hub-toc a { display: block; padding: 7px 10px; border-radius: 8px; color: var(--ink); font-size: 0.92rem; font-weight: 550; text-decoration: none; }
    .hub-toc a:hover { background: var(--pale-blue); color: var(--gsu-blue); }
    .hub-content { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 44px; max-width: 860px; }
    .hub-content h2 { color: var(--gsu-blue); border-bottom: 2px solid var(--pale-blue); padding-bottom: 8px; margin-top: 2em; }
    .hub-content h2:first-child { margin-top: 0; }
    .hub-content h3 { margin-top: 1.6em; }
    .hub-content table { width: 100%; border-collapse: collapse; margin: 14px 0 20px; font-size: 0.93rem; }
    .hub-content th { background: var(--pale-blue); color: var(--gsu-blue-dark); text-align: left; }
    .hub-content th, .hub-content td { border: 1px solid var(--border); padding: 9px 12px; vertical-align: top; }
    .hub-content .hub-note { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: 10px; padding: 12px 16px; font-size: 0.9rem; }
    @media (max-width: 900px) {
      .hub-layout { grid-template-columns: 1fr; }
      .hub-toc { position: static; }
      .hub-content { padding: 26px 22px; }
    }
    @media print { .hub-bar, .hub-toc { display: none; } .hub-content { border: none; } }

    /* ---- Manual v2 components (hero, checklists, system cards, timeline) ---- */
    .bm-lead { font-size: 1.05rem; }
    .bm-pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; margin: 18px 0; }
    .bm-pillar { background: var(--pale-blue); border-radius: 14px; padding: 16px 18px; }
    .bm-pillar h4 { margin: 0 0 6px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gsu-blue); }
    .bm-pillar p { margin: 0; font-size: 0.92rem; }
    .bm-jump { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
    .bm-jump-label { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
    .bm-jump-btn { display: inline-block; background: var(--gsu-blue); color: var(--white); border-radius: 999px; padding: 7px 16px; font-size: 0.86rem; font-weight: 650; text-decoration: none; }
    .bm-jump-btn:hover { background: var(--gsu-blue-dark); text-decoration: none; color: var(--white); }
    .bm-soft { color: var(--muted); font-size: 0.88rem; }
    .bm-checklist { list-style: none; padding: 0; margin: 14px 0 22px; display: grid; gap: 10px; }
    .bm-checklist label { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; cursor: pointer; transition: border-color .15s ease; }
    .bm-checklist label:hover { border-color: var(--gsu-blue); }
    .bm-checklist input { width: 19px; height: 19px; margin-top: 3px; accent-color: var(--gsu-blue); flex: none; cursor: pointer; }
    .bm-checklist input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(81,97,126,0.45); }
    .bm-sys { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; margin: 18px 0 8px; }
    .bm-sys-card { border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; background: var(--white); box-shadow: var(--shadow); }
    .bm-sys-card p { font-size: 0.92rem; margin-bottom: 0.7em; }
    .bm-sys-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
    .bm-sys-head h3 { margin: 0; font-size: 1.05rem; }
    .bm-sys-num { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--gsu-blue), var(--cool-blue)); color: var(--white); display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: var(--font-display); flex: none; }
    .bm-where { font-size: 0.85rem; color: var(--gsu-blue-dark); background: var(--pale-blue); border-radius: 8px; padding: 7px 11px; }
    .bm-rules { display: grid; gap: 12px; margin: 16px 0; }
    .bm-rule { border-left: 4px solid var(--gsu-blue); background: var(--surface); border-radius: 0 12px 12px 0; padding: 12px 16px; }
    .bm-rule h4 { margin: 0 0 4px; font-size: 0.95rem; color: var(--gsu-blue-dark); }
    .bm-rule p { margin: 0; font-size: 0.92rem; }
    .bm-money { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: 14px; padding: 16px 20px; margin: 18px 0; }
    .bm-money h4 { margin: 0 0 6px; }
    .bm-money p { margin: 0; font-size: 0.92rem; }
    .bm-tl { list-style: none; margin: 20px 0; padding: 0; }
    .bm-tl li { display: grid; grid-template-columns: 148px 1fr; gap: 16px; margin-bottom: 14px; }
    .bm-tl-when { font-family: var(--font-display); font-weight: 700; font-size: 0.82rem; color: var(--gsu-blue); background: var(--pale-blue); border-radius: 999px; padding: 6px 10px; text-align: center; align-self: start; }
    .bm-tl-body { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
    .bm-tl-body p { margin: 0 0 6px; font-size: 0.92rem; }
    .bm-tl-ref { font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cool-blue); }
    .bm-fires { display: grid; gap: 10px; margin: 14px 0; }
    .bm-fire { border: 1px solid var(--border); border-radius: 12px; background: var(--white); }
    .bm-fire summary { cursor: pointer; font-weight: 700; padding: 12px 16px; }
    .bm-fire[open] summary { border-bottom: 1px solid var(--border); }
    .bm-fire p { margin: 10px 16px 14px; font-size: 0.92rem; }
    .bm-phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; margin: 16px 0; }
    .bm-phase { border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; background: var(--white); box-shadow: var(--shadow); }
    .bm-phase-tag { display: inline-block; font-size: 0.74rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.09em; color: var(--white); background: linear-gradient(120deg, var(--gsu-blue), var(--cool-blue)); border-radius: 999px; padding: 5px 12px; margin-bottom: 10px; }
    .bm-phase p { margin: 0; font-size: 0.92rem; }
    @media (max-width: 640px) {
      .bm-tl li { grid-template-columns: 1fr; gap: 8px; }
      .bm-tl-when { justify-self: start; }
    }
  </style>
</head>
<body>

  <!-- ============ LOCK SCREEN ============ -->
  <div class="lock-wrap" id="lockWrap">
    <div class="lock-card">
      <img src="../assets/img/ats-logo.svg" alt="ATS logo">
      <h1>Board Members Area</h1>
      <p>For ATS board members and associates. Enter the board password to open the club's operating manual.</p>
      <form id="lockForm">
        <label for="pwInput">Board password</label>
        <input type="password" id="pwInput" autocomplete="current-password">
        <button class="btn btn-primary" type="submit">Unlock</button>
      </form>
      <div class="lock-error" id="lockError" role="alert"></div>
      <div class="lock-back"><a href="../index.html">← Back to the main site</a></div>
    </div>
  </div>

  <!-- ============ HUB (shown after unlock) ============ -->
  <div class="hub" id="hub">
    <div class="hub-bar">
      <div class="container">
        <span class="hb-title">🔒 ATS Board Operating Manual</span>
        <span>
          <a href="../tools/rekey.html" style="margin-right:16px;">Edit / change password</a>
          <a href="../index.html" style="margin-right:16px;">Main site</a>
          <button id="lockBtn" type="button">Lock</button>
        </span>
      </div>
    </div>
    <div class="container hub-layout">
      <nav class="hub-toc" aria-label="Manual sections">
        <h4>Sections</h4>
        <div id="tocLinks"></div>
      </nav>
      <article class="hub-content" id="hubContent"></article>
    </div>
  </div>

    const enc = new TextEncoder();
    const b64ToBytes = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

    async function deriveKey(password, salt) {
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 310000, hash: "SHA-256" },
        keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
    }

    async function decryptContent(password) {
      const key = await deriveKey(password, b64ToBytes(ENCRYPTED.s));
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(ENCRYPTED.i) }, key, b64ToBytes(ENCRYPTED.c)
      );
      return new TextDecoder().decode(plain);
    }

    function showHub(html) {
      document.getElementById("hubContent").innerHTML =
        '<h1 class="sr-only">ATS Board Operating Manual</h1>' + html;
      // Build the table of contents from h2 headings
      const toc = document.getElementById("tocLinks");
      toc.innerHTML = "";
      document.querySelectorAll("#hubContent h2").forEach((h, i) => {
        if (!h.id) h.id = "sec-" + i;
        const a = document.createElement("a");
        a.href = "#" + h.id;
        a.textContent = h.textContent;
        toc.appendChild(a);
      });
      // Checklists (first week, handover): remember checkmarks on this device.
      try {
        const KEY = "ats-board-manual-checks";
        const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
        document.querySelectorAll("#hubContent [data-ck]").forEach((cb) => {
          if (saved[cb.dataset.ck]) cb.checked = true;
        });
        document.getElementById("hubContent").addEventListener("change", (e) => {
          const cb = e.target && e.target.dataset && e.target.dataset.ck ? e.target : null;
          if (!cb) return;
          const s = JSON.parse(localStorage.getItem(KEY) || "{}");
          s[cb.dataset.ck] = cb.checked;
          localStorage.setItem(KEY, JSON.stringify(s));
        });
      } catch (err) { /* private browsing — boxes still tick, just aren't remembered */ }
      document.getElementById("lockWrap").style.display = "none";
      document.getElementById("hub").style.display = "block";
    }

    async function tryUnlock(password, silent) {
      const err = document.getElementById("lockError");
      try {
        const html = await decryptContent(password);
        try { sessionStorage.setItem("ats_board_key", password); } catch (e) {}
        showHub(html);
      } catch (e) {
        if (!silent) err.textContent = "That password isn't right. Ask the President if you need it.";
      }
    }

    document.getElementById("lockForm").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const pw = document.getElementById("pwInput").value;
      if (pw) tryUnlock(pw, false);
    });

    document.getElementById("lockBtn").addEventListener("click", () => {
      try { sessionStorage.removeItem("ats_board_key"); } catch (e) {}
      location.reload();
    });

    // Auto-unlock within the same browser session
    try {
      const saved = sessionStorage.getItem("ats_board_key");
      if (saved) tryUnlock(saved, true);
    } catch (e) {}
  </script>
